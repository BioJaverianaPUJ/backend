services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
  
  rustfs:
    image: rustfs/rustfs:latest
    container_name: bj-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bj-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: bj-bioclip-worker
    restart: unless-stopped
    environment:
      MODEL_NAME: imageomics/bioclip-2
      DEVICE: cuda
      MODEL_PRECISION: float16
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rabbitmq
      RABBITMQ_PASSWORD: rabbitmq
      RABBITMQ_EXCHANGE: observation.jobs.exchange
      RABBITMQ_INPUT_QUEUE: observation.jobs
      RABBITMQ_RESPONSE_QUEUE: observation.jobs.response
      RABBITMQ_RESPONSE_ROUTING_KEY: observation.jobs.response
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: biojaveriana
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: true
      INFERENCE_TEMPERATURE: 100.0
      CONSUMER_COUNT: 4
      LOG_LEVEL: INFO
      SHUTDOWN_TIMEOUT: 30.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - rabbitmq
      - rustfs
    volumes:
      - model-cache:/root/.cache/huggingface

volumes:
  postgres-data:
  rustfs-data:
  model-cache: