spring:
  application:
    name: api

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: ${JDBC_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      show-sql: ${JPA_SHOW_SQL:true}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rabbitmq}
    password: ${RABBITMQ_PASSWORD:rabbitmq}

  amqp:
    template:
      exchange: outbox.exchange
    listener:
      simple:
        auto-declare: true

server:
  port: ${SERVER_PORT:8000}

app:
  jwt:
    secret: ${JWT_SECRET:M+n7MHJvcNwm6NqYcTNVRgpuGziL/jvM+BHBC7iQ1d8=}

  rabbitmq:
    queue-names: "observation.jobs"
    response-queue: "observation.jobs.response"
    dead-letter-queue: "observation.jobs.dlq"
    job-expiry-hours: 24

  outbox:
    processing:
      delayMs: 10000

  s3:
    bucket: ${S3_BUCKET:biojaveriana}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:rustfsadmin}
    secret-key: ${S3_SECRET_KEY:rustfsadmin}

  specimen-matching:
    enabled: true
    min-certainty: 0.00315 # 95% for 301 species
    max-distance-meters: 50
